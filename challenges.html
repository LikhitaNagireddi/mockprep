<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {
  getFirestore,
  collection,
  query,
  where,
  getDocs
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDEGFN4ESTLI1aLHAobBvPJwOlRYuw5gQI",
  authDomain: "interview-practice-website.firebaseapp.com",
  projectId: "interview-practice-website"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const STREAK_KEY = 'mockprep_streak';
const LAST_DATE_KEY = 'mockprep_last_date';

function formatDate(date) {
  return date.toISOString().split('T')[0];
}

function updateStreakDisplay(count) {
  document.getElementById('streakCount').textContent = `${count} Days`;
}

function loadStreak() {
  const lastDate = localStorage.getItem(LAST_DATE_KEY);
  const streak = parseInt(localStorage.getItem(STREAK_KEY)) || 0;
  const today = formatDate(new Date());

  if (lastDate === today) {
    updateStreakDisplay(streak);
    return;
  }

  const yesterday = new Date();
  yesterday.setDate(yesterday.getDate() - 1);
  const yesterdayStr = formatDate(yesterday);

  if (lastDate === yesterdayStr) {
    const newStreak = streak + 1;
    localStorage.setItem(STREAK_KEY, newStreak);
    localStorage.setItem(LAST_DATE_KEY, today);
    updateStreakDisplay(newStreak);
  } else {
    localStorage.setItem(STREAK_KEY, 1);
    localStorage.setItem(LAST_DATE_KEY, today);
    updateStreakDisplay(1);
  }
}

window.addEventListener('DOMContentLoaded', loadStreak);

// ✅ Fetch random coding question
async function getRandomQuestion(subject) {
  const q = query(
    collection(db, "mock_questions"),
    where("subject", "==", subject.toLowerCase()),
    where("type", "==", "coding")
  );

  const snapshot = await getDocs(q);
  const questions = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));

  if (questions.length === 0) {
    alert("No questions found for " + subject);
    return;
  }

  const randomIndex = Math.floor(Math.random() * questions.length);
  const question = questions[randomIndex];

  // Save question in localStorage (optional)
  localStorage.setItem("daily_challenge_question", JSON.stringify(question));

  // Redirect to compiler with subject and question ID
  window.location.href = `compiler.html?subject=${subject}&qid=${question.id}&daily=true`;
}

// ✅ Setup click for challenge cards
document.querySelectorAll('.challenge-card').forEach(card => {
  card.addEventListener('click', () => {
    const subject = card.textContent.trim();
    getRandomQuestion(subject);
  });
});
</script>
